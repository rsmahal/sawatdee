name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build-image:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean (In Parallel with Existing Containers)
    needs: test-and-build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME || secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          envs: REGISTRY,IMAGE_NAME,GITHUB_ACTOR
          script: |
            TARGET_IMAGE="ghcr.io/${{ github.repository }}:latest"
            CONTAINER_NAME="sawatdee-app"
            HOST_PORT="${{ secrets.DO_APP_PORT || '3001' }}"

            echo "==> Deploying $TARGET_IMAGE in parallel..."
            echo "==> Target container: $CONTAINER_NAME on host port $HOST_PORT"

            # Authenticate with GHCR if deploy token provided, or fallback to docker pull
            if [ -n "${{ secrets.CR_PAT }}" ]; then
              echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            elif [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # Pull the prebuilt image from GHCR
            echo "==> Pulling latest image: $TARGET_IMAGE..."
            docker pull "$TARGET_IMAGE"

            # Safely stop and replace only the sawatdee container
            # (mario-kart-app on port 3000 is left running untouched)
            if [ "$(docker ps -aq -f name=^/${CONTAINER_NAME}$)" ]; then
              echo "==> Stopping and removing old $CONTAINER_NAME container..."
              docker stop "$CONTAINER_NAME" || true
              docker rm "$CONTAINER_NAME" || true
            fi

            # Run sawatdee container on host port 3001
            echo "==> Starting new $CONTAINER_NAME container on 0.0.0.0:$HOST_PORT -> 3000..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${HOST_PORT}:3000" \
              "$TARGET_IMAGE"

            # Clean up old unused images to save disk space on 10GB droplet
            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Status of running containers:"
            docker ps

            echo "==> Sawatdee successfully deployed alongside existing containers!"
