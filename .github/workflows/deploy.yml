name: Build and Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-and-build-image:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to DigitalOcean (In Parallel with Existing Containers)
    needs: test-and-build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure target directory exists on droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME || secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.DO_APP_DIR || '/var/www/sawatdee' }}"
            mkdir -p "$APP_DIR"

      - name: Copy docker-compose.yml to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME || secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.DO_PORT || 22 }}
          source: "docker-compose.yml"
          target: "${{ secrets.DO_APP_DIR || '/var/www/sawatdee' }}"

      - name: Deploy Sawatdee + PostgreSQL via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME || secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE || '' }}
          port: ${{ secrets.DO_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.DO_APP_DIR || '/var/www/sawatdee' }}"
            cd "$APP_DIR"

            # Generate persistent secrets on first deploy (never overwritten on future deploys)
            if [ ! -f .env ]; then
              echo "==> Creating initial .env with persistent database & auth secrets..."
              PG_PASS=$(openssl rand -hex 24)
              AUTH_SECRET=$(openssl rand -hex 32)
              cat << EOF > .env
            POSTGRES_USER=sawatdee
            POSTGRES_PASSWORD=${PG_PASS}
            POSTGRES_DB=sawatdee
            BETTER_AUTH_SECRET=${AUTH_SECRET}
            BETTER_AUTH_URL=${{ secrets.DO_APP_URL || 'http://localhost:3001' }}
            HOST_PORT=${{ secrets.DO_APP_PORT || '3001' }}
            DOCKER_IMAGE=ghcr.io/${{ github.repository }}:latest
            EOF
              chmod 600 .env
            fi

            # Authenticate with GHCR if deploy token provided
            if [ -n "${{ secrets.CR_PAT }}" ]; then
              echo "${{ secrets.CR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            elif [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            # Remove legacy standalone sawatdee-app container if present
            if [ "$(docker ps -aq -f name=^/sawatdee-app$)" ] && [ -z "$(docker inspect --format '{{ index .Config.Labels "com.docker.compose.project" }}' sawatdee-app 2>/dev/null || true)" ]; then
              echo "==> Migrating standalone sawatdee-app to Docker Compose..."
              docker rm -f sawatdee-app || true
            fi

            echo "==> Pulling latest sawatdee image and starting stack..."
            docker compose pull sawatdee
            docker compose up -d --remove-orphans

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Running containers:"
            docker ps
